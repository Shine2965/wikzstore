<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikz Store - Menu Global</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
    *{
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body{
        font-family: 'Poppins', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #1b3a1b;
        padding: 20px;
        position: relative;
        overflow-x: hidden;
        background: linear-gradient(180deg, 
            #4fc3f7 0%, 
            #81d4fa 25%, 
            #a5d6a7 55%, 
            #66bb6a 75%, 
            #2e7d32 100%);
    }

    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 55%;
        background: 
            radial-gradient(ellipse 80% 50% at 20% 20%, rgba(255,255,255,0.85) 0%, transparent 50%),
            radial-gradient(ellipse 70% 45% at 70% 15%, rgba(255,255,255,0.7) 0%, transparent 50%),
            radial-gradient(ellipse 60% 40% at 45% 30%, rgba(255,255,255,0.6) 0%, transparent 45%),
            radial-gradient(ellipse 90% 50% at 85% 25%, rgba(255,255,255,0.75) 0%, transparent 50%);
        z-index: 0;
        pointer-events: none;
    }

    body::after {
        content: '';
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 45%;
        background: 
            radial-gradient(ellipse 120% 80% at 10% 100%, #43a047 0%, transparent 60%),
            radial-gradient(ellipse 100% 70% at 50% 100%, #2e7d32 0%, transparent 55%),
            radial-gradient(ellipse 110% 75% at 90% 100%, #1b5e20 0%, transparent 60%);
        z-index: 0;
        pointer-events: none;
        opacity: 0.7;
    }

    .container{
        width: 100%;
        max-width: 480px;
        background: rgba(255,255,255,0.85);
        backdrop-filter: blur(16px) saturate(160%);
        -webkit-backdrop-filter: blur(16px) saturate(160%);
        border-radius: 22px;
        padding: 35px 25px;
        text-align: center;
        border: 2px solid rgba(46,125,50,0.25);
        box-shadow: 0 25px 60px rgba(27,94,32,0.18), inset 0 1px 0 rgba(255,255,255,0.7);
        position: relative;
        z-index: 1;
    }

    h1{
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 24px;
        letter-spacing: 0.5px;
        background: linear-gradient(135deg, #1b5e20, #2e7d32, #43a047);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .gmail-display {
        background: rgba(76,175,80,0.1);
        border: 1px solid rgba(46,125,50,0.25);
        border-radius: 12px;
        padding: 10px 14px;
        margin: 10px 0 16px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        font-size: 13px;
    }

    .gmail-display .label {
        color: #2e7d32;
        font-weight: 500;
    }

    .gmail-display .value {
        color: #1b5e20;
        font-weight: 600;
        word-break: break-all;
        flex: 1;
        text-align: left;
        padding: 0 8px;
    }

    .gmail-display .value.not-set {
        color: #c62828;
        font-style: italic;
        font-weight: 500;
    }

    .gmail-display .btn-change {
        background: rgba(46,125,50,0.15);
        border: 1px solid rgba(46,125,50,0.3);
        color: #1b5e20;
        padding: 4px 14px;
        border-radius: 8px;
        font-size: 11px;
        cursor: pointer;
        transition: 0.3s;
        font-family: 'Poppins', sans-serif;
        font-weight: 600;
    }

    .gmail-display .btn-change:hover {
        background: rgba(46,125,50,0.28);
    }

    .announcement-dropdown {

        border: 1px solid rgba(46,125,50,0.2);
        border-radius: 14px;
